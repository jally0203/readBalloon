name: Build Windows EXE

# 當 push 到 main 或 master 分支時自動觸發
on:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest  # 使用 GitHub 提供的 Windows 虛擬機

    steps:
      # 1. 檢出 (Checkout) 程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python 3.12 環境
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安裝依賴套件至獨立 venv
      - name: Install dependencies inside venv
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\pip.exe install pyinstaller
          
          if (Test-Path requirements.txt) { 
              .\venv\Scripts\pip.exe install -r requirements.txt 
          } else {
              .\venv\Scripts\pip.exe install ezdxf
          }

          # 卸載隱式拉進來的大型套件
          .\venv\Scripts\pip.exe uninstall -y numpy matplotlib scipy pillow pandas fonttools

      # 4. 使用 venv 內的 PyInstaller 打包 (包含模組排除)
      - name: Build EXE with PyInstaller
        run: |
          # 關鍵：直接指定 venv 裡面的 pyinstaller.exe，確保只打包 venv 的套件！
          .\venv\Scripts\pyinstaller.exe --noconfirm --onedir --clean `
            --name "readBalloon" `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module PIL `
            --exclude-module pandas `
            --exclude-module fonttools `
            --exclude-module unittest `
            --exclude-module xml `
            --exclude-module email `
            --exclude-module http `
            readBalloon_v500.py

      # 5. 將打包出的資料夾壓縮成 ZIP (壓縮率最高，下載體積最小)
      - name: Compress Output Folder
        run: |
          Compress-Archive -Path dist/readBalloon/* -DestinationPath readBalloon_Windows.zip

      # 6. 上傳 ZIP 檔至 GitHub Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: readBalloon-Windows-ZIP
          path: readBalloon_Windows.zip
